# tester.conf -- what the tester expects where the subject leaves a choice.
# Every line commented out = the default shown. Uncomment and edit to match the
# server; a wrong entry shows as NOTE or FAIL in the affected checks.
# python3 test_irc.py --show-config prints the current values.
#
# line_endings      = lf_ok        # lf_ok | crlf_only   accept a bare \n (nc sends it) or require \r\n
# max_line          = 510          # message bytes without CRLF (RFC 2812: 510)
# overlong          = reject       # reject | truncate | ignore   what an over-long line gets
# overlong_strikes  = 3            # close after N over-long lines in a row; 0 = never
# slow_client       = keep         # keep | drop   a client that never reads
# missing_mode_arg  = any          # 461 | specific | any   reply to MODE +k/+l/+o with no argument
# user_modes        = none         # none | supported
# welcome_burst     = yes          # yes | no   002 003 004 005 after 001
# casemapping       = rfc1459      # rfc1459 | ascii | none
# nonmember_send    = reject       # reject | deliver   PRIVMSG to a channel you are not in
# bot_nick          = DCCBot       # bonus bot nickname
# clients           = 20           # many-clients scenario
# slow_clients      = 30           # slow-reader load scenario
# rcvbuf            = 2048         # receive buffer of the stalled/slow test clients
# flood_mb          = 4            # MB queued toward the stalled client in the flood scenario
# timeout           = 4.0          # seconds to wait for a reply per check
